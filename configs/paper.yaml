# Explicit paper settings; all otherwise unspecified implementation choices are documented in README.
data:
  seed: 42
  sft_per_direction: 10000
  rl_per_direction: 2000
  near_duplicate_jaccard: 0.9
execution:
  image: cleartrans-runner:0.1
  timeout: 10
  compile_timeout: 90
  memory: 1g
  comparison: tokens
sonarqube:
  url_env: SONAR_HOST_URL
  token_env: SONAR_TOKEN
  server_version_prefix: '2025.1'
  manifest_path: artifacts/sonar_manifest.json
  scanner_command: [sonar-scanner]
  project_prefix: cleartrans_repro
  cache_dir: artifacts/sonar_cache
  work_dir: /tmp/cleartrans-sonar
  max_concurrent_scans: 2
  scan_timeout: 600
  queue_timeout: 3600
  delete_temporary_projects: true
  # Replace with actual study profiles. Sonar way is a runnable starting configuration,
  # NOT a recovered historical rule list. Snapshot exports include the full active profiles.
  profiles:
    c: Sonar way
    cpp: Sonar way
    go: Sonar way
    java: Sonar way
    python: Sonar way
teacher:
  base_url: http://127.0.0.1:8000/v1
  api_key_env: LLM_API_KEY
  model: Qwen2.5-32B-Instruct
  temperature: 0.7
  max_tokens: 8192
  timeout: 600
synthesis:
  seed: 42
  n_candidates: 15
  max_refinement_rounds: 5
scoring:
  model: Qwen/Qwen2.5-3B
  dtype: bfloat16
  device_map: auto
  max_length: 8192
sft:
  model: Qwen/Qwen2.5-3B
  k: 3
  seed: 42
  epochs: 3
  learning_rate: 1.0e-5
  max_length: 8192
  batch_size: 1
  gradient_accumulation_steps: 8
  bf16: true
  deepspeed: configs/zero3.json
  output_dir: artifacts/sft
grpo:
  model: artifacts/sft
  seed: 42
  epochs: 10
  learning_rate: 1.0e-6
  group_size: 12
  alpha: 0.2
  epsilon: 1.0e-6
  reward_mode: dual
  max_prompt_length: 4096
  max_completion_length: 4096
  # On 8 GPUs: 8 * 1 * 3 = 24 generations, i.e. two COMPLETE 12-candidate groups.
  batch_size: 1
  gradient_accumulation_steps: 3
  steps_per_generation: 3
  temperature: 0.7
  beta: 0.04
  bf16: true
  deepspeed: configs/zero3.json
  output_dir: artifacts/grpo
inference:
  base_url: http://127.0.0.1:8001/v1
  api_key_env: LLM_API_KEY
  model: cleartrans
  temperature: 0.7
  max_tokens: 8192
  timeout: 600
  seed: 42
  repair_rounds: 3
judge:
  base_url: http://127.0.0.1:8002/v1
  api_key_env: JUDGE_API_KEY
  model: Qwen3-Next-80B-A3B-Instruct
  temperature: 0.0
  max_tokens: 4096
pylint:
  command: [pylint]
  rcfile: configs/pylintrc
pmd:
  command: [pmd]
  ruleset: configs/pmd-ruleset.xml
