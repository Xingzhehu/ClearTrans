[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cleartrans-replication"
version = "0.1.0"
description = "Reconstructed ClearTrans research implementation"
requires-python = ">=3.10,<3.13"
dependencies = ["PyYAML==6.0.2", "requests==2.32.5", "Pygments==2.19.2"]

[project.optional-dependencies]
train = ["torch==2.8.0", "transformers==4.56.2", "accelerate==1.10.1", "datasets==4.0.0", "trl==0.22.1", "deepspeed==0.17.6"]
test = ["pytest==8.4.2"]

[project.scripts]
cleartrans = "cleartrans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
